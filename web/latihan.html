<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kuis Interaktif | IsyaraTalk</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="js/Image/logoisyara.png">
<link rel="stylesheet" href="js/quiz.css">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-200 font-inter h-screen flex flex-col overflow-hidden">

<!-- Header / Progress Header -->
<header class="bg-slate-800 border-b border-slate-700 h-16 flex items-center px-4 z-20">
  <div class="flex items-center gap-4 w-full max-w-4xl mx-auto">
    <a href="index.html" class="text-slate-500 hover:text-slate-300 transition">
      <i class="fa-solid fa-xmark text-2xl"></i>
    </a>
    
    <!-- Progress Bar (Hidden by default) -->
    <div id="progressContainer" class="hidden flex-1 flex items-center gap-4 ml-4">
        <div class="w-full bg-slate-700 rounded-full h-4 overflow-hidden relative">
            <div id="progressBar" class="bg-green-500 h-full transition-all duration-500 ease-out" style="width: 0%"></div>
        </div>
        <span id="progressText" class="text-slate-400 font-bold text-sm whitespace-nowrap">0 / 0</span>
    </div>
  </div>
</header>

<main class="flex-1 overflow-y-auto relative w-full max-w-2xl mx-auto p-4 flex flex-col justify-center min-h-0">
  
  <!-- Level Selection Screen -->
  <div id="levelScreen" class="w-full max-w-md mx-auto space-y-6 animate-fade-in">
    <div class="text-center">
      <img src="js/Image/logoisyara.png" alt="Mascot" class="w-24 h-24 mx-auto mb-4 object-contain">
      <h1 class="text-2xl font-bold text-white">Pilih Level Latihan</h1>
      <p class="text-slate-400">Mulai perjalananmu menguasai bahasa isyarat!</p>
    </div>
    
    <div id="levelList" class="space-y-3">
      <!-- Levels will be injected here -->
    </div>
  </div>

  <!-- Question Container -->
  <div id="quizContainer" class="hidden w-full space-y-6 pb-24">
    <h2 id="questionText" class="text-2xl font-bold text-slate-100 leading-tight">Pertanyaan?</h2>
    
    <!-- Dynamic Content Area -->
    <div id="questionContent" class="w-full">
        <!-- Content (Image, Video, Camera) goes here -->
    </div>

    <!-- Options Area -->
    <div id="optionsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Buttons go here -->
    </div>
  </div>

  <!-- Result Screen -->
  <div id="resultScreen" class="hidden w-full text-center space-y-6 animate-slide-up">
    <div class="w-32 h-32 bg-yellow-400 rounded-full mx-auto flex items-center justify-center text-6xl text-white shadow-lg mb-6">
      <i class="fa-solid fa-trophy"></i>
    </div>
    <h2 class="text-3xl font-extrabold text-yellow-500">Latihan Selesai!</h2>
    <div class="max-w-xs mx-auto">
      <div class="bg-blue-900/30 p-4 rounded-xl border-2 border-blue-700">
        <div class="text-blue-400 font-bold text-sm uppercase">Akurasi</div>
        <div class="text-2xl font-extrabold text-blue-400" id="resultAccuracy">0%</div>
      </div>
    </div>
    <button id="restartBtn" class="w-full max-w-xs py-3 rounded-xl bg-blue-500 text-white font-bold shadow-b-blue active:translate-y-1 transition-all">
      Lanjut
    </button>
  </div>

</main>

<!-- Bottom Action Bar (Fixed) -->
<div id="bottomBar" class="hidden fixed bottom-0 inset-x-0 bg-slate-800 border-t border-slate-700 p-4 z-30 animate-slide-up">
  <div class="max-w-4xl mx-auto flex items-center justify-between">
    <div id="feedbackArea" class="hidden flex items-center gap-4">
      <div id="feedbackIcon" class="w-12 h-12 rounded-full flex items-center justify-center text-2xl">
        <i class="fa-solid fa-check"></i>
      </div>
      <div>
        <div id="feedbackTitle" class="font-bold text-xl">Benar!</div>
        <div id="feedbackMessage" class="text-sm"></div>
      </div>
    </div>
    
    <button id="checkBtn" class="ml-auto px-8 py-3 rounded-xl bg-green-500 text-white font-bold text-lg shadow-b-green transition-transform active:translate-y-1 disabled:opacity-50 disabled:cursor-not-allowed">
      PERIKSA
    </button>
    <button id="nextBtn" class="hidden ml-auto px-8 py-3 rounded-xl bg-green-500 text-white font-bold text-lg shadow-b-green transition-transform active:translate-y-1">
      LANJUT
    </button>
  </div>
</div>

<!-- Audio Effects -->
<audio id="sfxCorrect" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="sfxWrong" src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>
<audio id="sfxWin" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

<script type="module" src="js/quiz.js"></script>
</body>
</html>
